[OpenAI]
#
# OpenAI or Azure OpenAI Service
#

# Default options: openai, azure
API_TYPE=openai

# Check Azure's documentation for updates here:
# https://learn.microsoft.com/en-us/azure/ai-services/openai/chatgpt-quickstart?tabs=command-line&pivots=programming-language-python
AZURE_API_VERSION=2023-05-15

#
# Models
#

# The main text generation model, used for agent responses
MODEL=gpt-4.1-mini

# Reasoning model is used when precise reasoning is required, such as when computing detailed analyses of simulation properties.
REASONING_MODEL=o3-mini

# Embedding model is used for text similarity tasks
EMBEDDING_MODEL=text-embedding-3-small

#
# HuggingFace Embeddings (for faster, cheaper semantic memory)
#
# Set to True to use HuggingFace embeddings instead of OpenAI/Azure embeddings
USE_HF_EMBEDDINGS=True

# Recommended: Multilingual model supporting Portuguese, Spanish, and 50+ languages
# This model is ~7x faster than BAAI/bge-m3 with only 5-10% quality trade-off
HF_EMBEDDING_MODEL=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2

# Alternative options:
# - BAAI/bge-m3 (maximum quality, slowest, 568M params)
# - sentence-transformers/distiluse-base-multilingual-cased-v2 (balanced, 135M params)
# - BAAI/bge-small-en-v1.5 (English-only, 33M params, 5x faster)
# - sentence-transformers/all-MiniLM-L6-v2 (English-only, 23M params, 10x faster)

#
# Model parameters
#
MAX_TOKENS=32000
TEMPERATURE=1.5
FREQ_PENALTY=0.1
PRESENCE_PENALTY=0.1
TIMEOUT=480
MAX_ATTEMPTS=5
WAITING_TIME=1
EXPONENTIAL_BACKOFF_FACTOR=5

REASONING_EFFORT=high

#
# Caching
#

CACHE_API_CALLS=False
CACHE_FILE_NAME=openai_api_cache.pickle

#
# Other
#

MAX_CONTENT_DISPLAY_LENGTH=4000

[Simulation]

PARALLEL_AGENT_GENERATION=True
PARALLEL_AGENT_ACTIONS=True

# Maximum similarity threshold for consecutive actions (0.0 to 1.0)
# If actions exceed this similarity, they are replaced with DONE to prevent loops
# Set to a lower value (e.g., 0.75) to catch similar actions sooner
# Set to None to disable similarity checking entirely
MAX_ACTION_SIMILARITY=0.85

RAI_HARMFUL_CONTENT_PREVENTION=True
RAI_COPYRIGHT_INFRINGEMENT_PREVENTION=True

[Cognition]

# Memory consolidation (converts episodic to semantic)
ENABLE_MEMORY_CONSOLIDATION=True

# Semantic memory retrieval (embedding-based context recall)
ENABLE_SEMANTIC_MEMORY_RETRIEVAL=True

# Number of relevant memories to retrieve per action (default was 7, optimized to 3)
# Lower = faster embedding calls, slightly less context
SEMANTIC_MEMORY_TOP_K=3

# Retrieval cache settings (improves performance for repeated queries)
# Number of queries to cache (LRU eviction)
SEMANTIC_MEMORY_CACHE_SIZE=50

# Cache lifetime in seconds (5 minutes default)
SEMANTIC_MEMORY_CACHE_TTL=300

# Episode memory settings
MIN_EPISODE_LENGTH=15
MAX_EPISODE_LENGTH=50

EPISODIC_MEMORY_FIXED_PREFIX_LENGTH=10
EPISODIC_MEMORY_LOOKBACK_LENGTH=20

[ActionGenerator]
MAX_ATTEMPTS=2

# This will determine whether any of the following verifications and corrections are performed.
ENABLE_QUALITY_CHECKS=False

ENABLE_REGENERATION=True
ENABLE_DIRECT_CORRECTION=False

ENABLE_QUALITY_CHECK_FOR_PERSONA_ADHERENCE=True
ENABLE_QUALITY_CHECK_FOR_SELFCONSISTENCY=False
ENABLE_QUALITY_CHECK_FOR_FLUENCY=False
ENABLE_QUALITY_CHECK_FOR_SUITABILITY=False
ENABLE_QUALITY_CHECK_FOR_SIMILARITY=False

CONTINUE_ON_FAILURE=True

# 0 to 9
QUALITY_THRESHOLD = 5


[Logging]
LOGLEVEL=ERROR
# ERROR
# WARNING
# INFO
# DEBUG